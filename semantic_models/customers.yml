version: 2

models:
  - name: customers
    description: This semantic model provides a comprehensive view of customer-related data.
    dimensions:
      - name: customer_id
        description: Unique identifier for each customer.
      - name: first_order_date
        description: The date when the customer placed their first order.
    measures:
      - name: total_customers
        description: The total number of customers.
      - name: active_customers
        description: The number of customers who have placed an order in the last 30 days.