semantic_models:
  - name: semantic_customers
    description: "Semantic model representing individual customers and their aggregated order information."
    model: ref('customers') # Refers to your existing customers.sql model
    defaults:
      agg_time_dimension: first_order_date # Default time dimension for aggregations

    entities:
      - name: customer
        type: primary
        expr: customer_id # The column that uniquely identifies a customer

    dimensions:
      - name: first_order_date
        type: time
        expr: first_order_date
        type_params:
          time_granularity: day
      - name: most_recent_order_date
        type: time
        expr: most_recent_order_date
        type_params:
          time_granularity: day
      - name: full_name # Example of a derived dimension
        type: categorical
        expr: first_name || ' ' || last_name

    measures:
      - name: count_of_customers
        description: "The total number of unique customers."
        agg: count_distinct
        expr: customer_id
      - name: total_number_of_orders_for_customer
        description: "Total orders placed by a customer."
        agg: sum
        expr: number_of_orders # from customers.sql
      - name: customer_lifetime_value # This measure should now be correct
        description: "Total revenue generated by a customer from successful payments."
        agg: sum
        expr: lifetime_value # from customers.sql, which now uses fct_orders