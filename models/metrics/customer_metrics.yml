
metrics:
  - name: total_unique_customers
    label: "Total Unique Customers"
    description: "The total count of distinct customers."
    type: simple
    calculation_method: measure
    expression: "{{ Measure('semantic_customers.count_of_customers') }}"
    # You could also define it directly if preferred for simple cases:
    # type: count_distinct
    # sql: "{{ Dimension('semantic_customers.customer_id') }}"

  - name: total_orders_from_customers_model
    label: "Total Orders (from Customers model)"
    description: "Sum of all orders attributed to customers, based on the customers model."
    type: simple
    calculation_method: measure
    expression: "{{ Measure('semantic_customers.total_number_of_orders_for_customer') }}"