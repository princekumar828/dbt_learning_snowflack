
metrics:
  - name: total_orders_placed
    label: "Total Orders Placed"
    description: "The total count of orders recorded."
    type: simple
    calculation_method: measure
    expression: "{{ Measure('semantic_orders.count_of_orders') }}"

  - name: total_revenue # This metric will now use the corrected measure
    label: "Total Revenue"
    description: "The sum of amounts from all successfully paid orders."
    type: simple
    calculation_method: measure
    expression: "{{ Measure('semantic_orders.total_revenue_from_orders') }}"
    # No filter needed here if fct_orders already handles successful payments

  - name: average_order_value # This metric will also be corrected
    label: "Average Order Value"
    description: "The average amount per successfully paid order."
    type: ratio
    numerator: "{{ Metric('total_revenue') }}"
    denominator: "{{ Metric('total_orders_placed') }}"