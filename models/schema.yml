version: 2

models:
  - name: customers
    description: One record per customer
    columns:
      - name: customer_id
        description: Primary key
        tests:
          - unique
          - not_null
      - name: first_order_date
        description: NULL when a customer has not yet placed an order.

  - name: stg_customers
    description: This model cleans up customer data
    columns:
      - name: customer_id
        description: Primary key
        tests:
          - unique
          - not_null

  - name: stg_orders
    description: This model cleans up order data
    columns:
      - name: order_id
        description: Primary key
        tests:
          - unique
          - not_null
      - name: status
        tests:
          - accepted_values:
              values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id

  - name: customer_metrics
    description: Metrics related to customer data
    columns:
      - name: total_customers
        description: Total number of customers
      - name: active_customers
        description: Number of customers who have placed an order

  - name: order_metrics
    description: Metrics related to order data
    columns:
      - name: total_orders
        description: Total number of orders placed
      - name: average_order_value
        description: Average value of orders placed

  - name: customer_order_summary
    description: Summary report of customer orders
    columns:
      - name: customer_id
        description: ID of the customer
      - name: total_orders
        description: Total number of orders placed by the customer
      - name: total_spent
        description: Total amount spent by the customer