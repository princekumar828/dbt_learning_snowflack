version: 2

models:
  - name: customers
    description: "One record per customer, with aggregated order information."
    columns:
      - name: customer_id
        description: "Primary key for customers."
        tests:
          - unique
          - not_null
      - name: first_name
        description: "Customer's first name."
        # tests:
        #   - not_null # Consider if this should be enforced
      - name: last_name
        description: "Customer's last name."
        # tests:
        #   - not_null # Consider if this should be enforced
      - name: first_order_date
        description: "The date of the customer's first order. NULL if no orders."
      - name: most_recent_order_date
        description: "The date of the customer's most recent order. NULL if no orders."
      - name: number_of_orders
        description: "The total count of orders placed by the customer."
        tests:
          - not_null # Since it's coalesced to 0
          # Add dbt_utils test if desired and package installed
          # - dbt_utils.expression_is_true:
          #     expression: ">= 0"
      - name: lifetime_value
        description: "The total monetary value of all orders placed by the customer (from successful payments)."
        tests:
          - not_null # Since it's coalesced to 0
          # Add dbt_utils test if desired and package installed
          # - dbt_utils.expression_is_true:
          #     expression: ">= 0"

  - name: stg_customers
    description: "This model cleans up customer data from the source."
    columns:
      - name: customer_id
        description: "Primary key for staged customers."
        tests:
          - unique
          - not_null
      - name: first_name
        description: "Customer's first name from source."
      - name: last_name
        description: "Customer's last name from source."

  - name: stg_orders
    description: "This model cleans up order data from the source."
    columns:
      - name: order_id
        description: "Primary key for staged orders."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to the staged customers table."
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_date
        description: "Date the order was placed."
        # tests:
        #   - not_null # Consider if this should be enforced
      - name: status
        description: "Status of the order (e.g., placed, shipped)."
        tests:
          - accepted_values:
              values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']

  # This was incorrectly nested before. It's now a top-level model definition.
  - name: stg_stripe_payments
    description: "Staging model for raw Stripe payment data. Amounts are converted to dollars."
    columns:
      - name: payment_id
        description: "Primary key for payments."
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Foreign key to the orders table."
        tests:
          - not_null
          # Consider adding a relationship test if desired, though fct_orders handles the join
          # - relationships:
          #     to: ref('stg_orders')
          #     field: order_id
      - name: payment_method
        description: "Method used for the payment (e.g., card, bank_transfer)."
      - name: payment_status
        description: "Status of the payment (e.g., success, fail)."
        tests:
          - accepted_values: # Example values, adjust to your actual data
              values: ['success', 'fail', 'pending']
      - name: amount
        description: "Payment amount in dollars."
        tests:
          - not_null
      - name: payment_created_date
        description: "Date the payment was created/recorded."

  - name: fct_orders
    description: "Fact table for orders, joining order information with successful payment amounts."
    columns:
      - name: order_id
        description: "Primary key for orders."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to the customers table."
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers') # This correctly points to stg_customers
              field: customer_id
      - name: order_date
        description: "Date the order was placed."
      - name: order_status
        description: "Status of the order."
      - name: total_amount_paid
        description: "Total amount successfully paid for the order in dollars."
        tests:
          - not_null
          # - dbt_utils.expression_is_true: # Uncomment if dbt-utils is installed
          #     expression: ">= 0"