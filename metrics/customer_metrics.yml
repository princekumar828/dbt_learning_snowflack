version: 2

metrics:
  - name: total_customers
    description: Total number of customers in the system
    calculation: count(distinct customer_id)

  - name: active_customers
    description: Number of customers who have placed at least one order
    calculation: count(distinct customer_id) where first_order_date is not null

  - name: new_customers
    description: Number of customers acquired in the last month
    calculation: count(distinct customer_id) where first_order_date >= date_trunc('month', current_date) - interval '1 month' 

  - name: churned_customers
    description: Number of customers who have not placed an order in the last 6 months
    calculation: count(distinct customer_id) where first_order_date < current_date - interval '6 months'